name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

# Cancel superseded runs on the same ref rather than queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # go.mod is authoritative. This previously pinned 1.22 while the module
  # declared 1.26, so the toolchain refused to build and every run was
  # meaningless.
  GO_VERSION: '1.26.1'
  # Node 20 is end-of-life. 24 is the current LTS and matches the runtime the
  # actions themselves now run on, so there is one Node version in play.
  NODE_VERSION: '24'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # The scheduling tests are real integration tests against PostgreSQL. They
    # used to be skipped for want of a database, which meant the highest-risk
    # area of the system had no coverage running anywhere.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shiftmaster
          POSTGRES_PASSWORD: shiftmaster
          POSTGRES_DB: shiftmaster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiftmaster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SHIFTMASTER_TEST_DB: postgres://shiftmaster:shiftmaster@localhost:5432/shiftmaster_test?sslmode=disable
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: shiftmaster
      DB_PASSWORD: shiftmaster
      DB_NAME: shiftmaster_test
      DB_SSL_MODE: disable

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # `go mod tidy` rewrites go.mod and go.sum during the build, so a run could
      # pass against dependencies that differ from the committed ones. Download
      # verifies instead of mutating.
      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' and commit the result."
            git diff go.mod go.sum
            exit 1
          fi

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./pkg)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./cmd/... ./internal/... ./pkg/...

      # v6 of this action targets golangci-lint v1 and does not understand the
      # v2 configuration format that .golangci.yml uses, so the lint step could
      # not have worked regardless of the Node runtime warning. v9 supports v2
      # and runs on node24.
      #
      # The linter version is pinned rather than `latest` so CI reproduces the
      # run this configuration was verified against; `latest` would let an
      # unrelated change start failing when a new release adds checks.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Apply migrations to the test database
        run: go run ./cmd/migrate -dir internal/database/migrations up

      # Asserted through exit codes rather than by matching log text, which was
      # brittle in both directions: it broke when the tool wrote its report to
      # stderr, and rewording the message would have silently disabled the check.
      - name: Verify migrations are idempotent
        run: |
          set -euo pipefail

          # `status` exits non-zero while anything is pending. Passing here means
          # every file is recorded in schema_migrations, which is exactly the
          # condition under which a second `up` has nothing left to do.
          go run ./cmd/migrate -dir internal/database/migrations status

          # And running it again must genuinely succeed, not merely skip.
          go run ./cmd/migrate -dir internal/database/migrations up

          # Still nothing pending afterwards.
          go run ./cmd/migrate -dir internal/database/migrations status

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./cmd/... ./internal/... ./pkg/...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Type errors previously only surfaced during `npm run build`, where they
      # were easy to miss among the bundler output.
      - name: Typecheck
        run: npx tsc -b --force

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  migrations:
    name: Migration series
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shiftmaster
          POSTGRES_PASSWORD: shiftmaster
          POSTGRES_DB: shiftmaster_fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiftmaster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: shiftmaster
      DB_PASSWORD: shiftmaster
      DB_NAME: shiftmaster_fresh
      DB_SSL_MODE: disable

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Proves a database can still be built from zero. Two earlier migrations
      # had broken this without anyone noticing, because nothing ever tried.
      - name: Build a database from an empty schema
        run: go run ./cmd/migrate -dir internal/database/migrations up

      # Uses the tool's own contract rather than querying the ledger with psql:
      # "nothing pending" is the same assertion as "every file is recorded", and
      # it does not depend on a client binary happening to be on the runner.
      - name: Confirm every migration was recorded
        run: go run ./cmd/migrate -dir internal/database/migrations status
